spring:
  application:
    name: xmlProcessing

  # SQL Server Configuration
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=FileStorageDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: admin
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  # JWT Authentication using pem file
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/public.pem

jwt:
  private-key-location: file:G:/Spring-Boot/Vault/private.pem
  expiration-ms: 3600000 # 1 hour

# Swagger UI Path: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

